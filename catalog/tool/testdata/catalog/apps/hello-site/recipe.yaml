format: 1
kind: app
id: hello-site
name: Hello site
version: "1.0.0"
summary: A static page that says hello.
license: MIT
licenseClass: open-source
homepage: https://hello.example.com/
icon: icon.svg
categories: [static]
maintainers: [{name: Example maintainers, github: example}]
requires: {modules: [web], memoryMB: 16, diskMB: 5}
inputs:
  - {name: domain, type: domain, label: Domain, required: true}
resources:
  - name: site
    kind: web.site
    spec: {domains: ["${inputs.domain}"], stack: static}
downloads:
  - url: https://downloads.example.com/hello-site-1.0.0.tar.gz
    sha256: f92b7faf2625dbd94e941242e8720b1948fa0e2193da3c99d0afcdbd20dc6e61
    size: 2048
health:
  - {type: http, target: "https://${inputs.domain}/", expect: "200"}
tests:
  inputs: {domain: hello.example.test}
  timeoutSeconds: 300
