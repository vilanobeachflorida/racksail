name: ISO

# Builds the installer images: amd64 and arm64, each without and with
# Debian's non-free firmware. live-build runs in a Debian 13 container on a
# runner of the image's own architecture. The release and end-to-end
# workflows call this one with the binaries they built.
on:
  workflow_call:
    inputs:
      version:
        description: Version the images are named and labelled with
        type: string
        required: true
      binaries:
        description: Artifact holding racksail-linux-amd64 and racksail-linux-arm64
        type: string
        required: true
  pull_request:
    paths:
      - iso/**
      - .github/workflows/iso.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  binaries:
    name: Binaries
    if: inputs.binaries == ''
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: make cross
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: iso-binaries
          path: bin/racksail-linux-*
          retention-days: 1

  image:
    name: ${{ matrix.arch }} ${{ matrix.variant }}
    needs: binaries
    # Runs after the binaries job, or without it when a caller brings them.
    if: ${{ !cancelled() && !failure() }}
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        variant: [standard, firmware]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.binaries || 'iso-binaries' }}
          path: bin
      - name: Build the image
        env:
          ARCH: ${{ matrix.arch }}
          VARIANT: ${{ matrix.variant }}
          VERSION: ${{ inputs.version || '0.0.0-dev' }}
        run: |
          chmod +x bin/racksail-linux-*
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          export SOURCE_DATE_EPOCH
          iso/in-container.sh --arch "$ARCH" --variant "$VARIANT" --binary "bin/racksail-linux-$ARCH" --version "$VERSION" --out iso-out
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: iso-${{ matrix.arch }}-${{ matrix.variant }}
          path: iso-out/*.iso
          compression-level: 0
          retention-days: 7
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: iso-${{ matrix.arch }}-${{ matrix.variant }}-log
          path: build/iso/*.log
          retention-days: 14
