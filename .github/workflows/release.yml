name: Release

# Publishes a release: on a version tag for the stable and beta channels,
# and every night from main for the nightly channel. Every file is signed
# keyless with Sigstore by this workflow, which is the identity install.sh
# and the panel's updater check: release.yml at the version's tag, or at
# main for nightly builds. Running it by hand on a tag publishes that tag's
# release again; on main it publishes a nightly build.
on:
  push:
    tags: ["v*"]
  schedule:
    - cron: "40 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      channel: ${{ steps.version.outputs.channel }}
      tag: ${{ steps.version.outputs.tag }}
      skip: ${{ steps.version.outputs.skip }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - id: version
        run: |
          skip=false
          case "$GITHUB_REF" in
          refs/tags/v*)
            version=${GITHUB_REF_NAME#v}
            ;;
          refs/heads/main)
            # Nothing new since the last nightly build means no new build.
            last=$(git tag --list 'v*nightly*' --sort=-creatordate | head -n 1)
            if [ -n "$last" ] && [ "$(git rev-list -n 1 "$last")" = "$GITHUB_SHA" ]; then
              skip=true
            fi
            version=$(go run ./packaging/release nightly-version -run "$GITHUB_RUN_NUMBER")
            ;;
          *)
            echo "Releases come from version tags, and nightly builds from main, not $GITHUB_REF." >&2
            exit 1
            ;;
          esac
          channel=$(go run ./packaging/release channel "$version")
          {
            echo "version=$version"
            echo "channel=$channel"
            echo "tag=v$version"
            echo "skip=$skip"
          } >>"$GITHUB_OUTPUT"
          echo "Racksail $version on the $channel channel (skip: $skip)"

  build:
    name: Binaries and packages
    needs: version
    if: needs.version.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - env:
          VERSION: ${{ needs.version.outputs.version }}
          CHANNEL: ${{ needs.version.outputs.channel }}
        run: make release VERSION="$VERSION" CHANNEL="$CHANNEL"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release
          path: dist/
          retention-days: 7

  iso:
    name: ISO
    needs: [version, build]
    uses: ./.github/workflows/iso.yml
    with:
      version: ${{ needs.version.outputs.version }}
      binaries: release

  publish:
    name: Sign and publish
    needs: [version, build, iso]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
      id-token: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      CHANNEL: ${{ needs.version.outputs.channel }}
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: iso-*-*
          path: dist
          merge-multiple: true
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Checksums
        run: |
          go run ./packaging/release checksums -dir dist
          cat dist/SHA256SUMS
      - name: Sign
        run: |
          for file in dist/*; do
            case $file in *.sigstore.json) continue ;; esac
            cosign sign-blob --yes --bundle "$file.sigstore.json" "$file"
          done
      - name: Manifest
        run: |
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG"
          go run ./packaging/release manifest -dir dist -tag "$TAG" -base-url "$base" \
            -notes "https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"
          cosign sign-blob --yes --bundle dist/release.json.sigstore.json dist/release.json
      - name: Check a signature as servers will
        run: |
          case $CHANNEL in
          nightly) ref=refs/heads/main ;;
          *) ref=refs/tags/$TAG ;;
          esac
          for file in racksail-linux-amd64 SHA256SUMS release.json; do
            cosign verify-blob --bundle "dist/$file.sigstore.json" \
              --certificate-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@$ref" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com "dist/$file"
          done
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=(--title "Racksail $VERSION" --generate-notes --target "$GITHUB_SHA")
          if [ "$CHANNEL" = stable ]; then
            flags+=(--latest)
          else
            flags+=(--prerelease --latest=false)
          fi
          if [ "$CHANNEL" != nightly ]; then
            flags+=(--verify-tag)
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" "${flags[@]}" dist/*
          fi
      - name: Keep the last two weeks of nightly builds
        if: env.CHANNEL == 'nightly'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The list comes newest first.
          gh release list --limit 200 --json tagName --jq '.[].tagName' | grep nightly | tail -n +15 |
            while read -r tag; do
              gh release delete "$tag" --cleanup-tag --yes
            done
