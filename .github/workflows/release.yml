name: Release

# Publishes a release: on a version tag for the stable and beta channels,
# and every night from main for the nightly channel. Every file is signed
# keyless with Sigstore by this workflow, which is the identity install.sh
# and the panel's updater check: release.yml at the version's tag, or at
# main for nightly builds. Nothing is published until servers running the
# previous release on the channel, and the newest stable release, upgrade to
# the new one in a test. Running it by hand on a tag publishes that tag's
# release again; on main it publishes a nightly build.
on:
  push:
    tags: ["v*"]
  schedule:
    - cron: "40 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      channel: ${{ steps.version.outputs.channel }}
      tag: ${{ steps.version.outputs.tag }}
      skip: ${{ steps.version.outputs.skip }}
      upgrade_from: ${{ steps.version.outputs.upgrade_from }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          skip=false
          case "$GITHUB_REF" in
          refs/tags/v*)
            version=${GITHUB_REF_NAME#v}
            ;;
          refs/heads/main)
            # Nothing new since the last nightly build means no new build.
            last=$(git tag --list 'v*nightly*' --sort=-creatordate | head -n 1)
            if [ -n "$last" ] && [ "$(git rev-list -n 1 "$last")" = "$GITHUB_SHA" ]; then
              skip=true
            fi
            version=$(go run ./packaging/release nightly-version -run "$GITHUB_RUN_NUMBER")
            ;;
          *)
            echo "Releases come from version tags, and nightly builds from main, not $GITHUB_REF." >&2
            exit 1
            ;;
          esac
          channel=$(go run ./packaging/release channel "$version")
          # Upgrades are tested from the newest earlier release on the
          # channel, and from the newest stable release; before the first
          # release there is nothing to upgrade from.
          tags=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq '.[] | select(.draft | not) | .tag_name')
          from_channel=$(printf '%s\n' "$tags" | go run ./packaging/release previous -version "$version")
          from_stable=$(printf '%s\n' "$tags" | go run ./packaging/release previous -version "$version" -channel stable)
          upgrade_from=$(printf '%s\n' "$from_channel" "$from_stable" | awk 'NF && !seen[$0]++' | jq --raw-input . | jq --slurp --compact-output .)
          {
            echo "version=$version"
            echo "channel=$channel"
            echo "tag=v$version"
            echo "skip=$skip"
            echo "upgrade_from=$upgrade_from"
          } >>"$GITHUB_OUTPUT"
          echo "Racksail $version on the $channel channel (skip: $skip), upgrading from $upgrade_from"

  build:
    name: Binaries and packages
    needs: version
    if: needs.version.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - env:
          VERSION: ${{ needs.version.outputs.version }}
          CHANNEL: ${{ needs.version.outputs.channel }}
        run: make release VERSION="$VERSION" CHANNEL="$CHANNEL"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release
          path: dist/
          retention-days: 7

  iso:
    name: ISO
    needs: [version, build]
    uses: ./.github/workflows/iso.yml
    with:
      version: ${{ needs.version.outputs.version }}
      binaries: release

  upgrade:
    name: Upgrade from ${{ matrix.from }}
    needs: [version, build]
    if: needs.version.outputs.upgrade_from != '[]'
    strategy:
      fail-fast: false
      matrix:
        from: ${{ fromJSON(needs.version.outputs.upgrade_from) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      VERSION: ${{ needs.version.outputs.version }}
      FROM: ${{ matrix.from }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: test/e2e/package-lock.json
      - name: Install QEMU and the firmware
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends qemu-utils qemu-system-x86 ovmf dosfstools mtools
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: cd test/e2e && npm ci --no-audit --no-fund && npx playwright install --with-deps chromium
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
          path: dist
      - name: Download the earlier release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The earlier package is checked the way install.sh checks a
          # release: its signature, then its checksum.
          package="racksail_${FROM#v}_amd64.deb"
          mkdir -p build/earlier
          gh release download "$FROM" --dir build/earlier --pattern "$package" --pattern "$package.sigstore.json" \
            --pattern SHA256SUMS --pattern SHA256SUMS.sigstore.json
          case $(go run ./packaging/release channel "$FROM") in
          nightly) ref=refs/heads/main ;;
          *) ref=refs/tags/$FROM ;;
          esac
          for file in "$package" SHA256SUMS; do
            cosign verify-blob --bundle "build/earlier/$file.sigstore.json" \
              --certificate-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@$ref" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com "build/earlier/$file"
          done
          cd build/earlier && grep " $package\$" SHA256SUMS | sha256sum --check
      - name: Download Debian's cloud image
        run: make cloud-image
      - name: Upgrade and test
        run: |
          go run ./test/qemu -cloud-image build/cloud/debian-13-genericcloud-amd64.qcow2 \
            -upgrade-from "build/earlier/racksail_${FROM#v}_amd64.deb" \
            -deb "dist/racksail_${VERSION}_amd64.deb" -version "$VERSION" -work build/e2e
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: upgrade-logs-${{ strategy.job-index }}
          path: build/e2e/logs
          retention-days: 14

  publish:
    name: Sign and publish
    needs: [version, build, iso, upgrade]
    # A release goes out when the upgrade tests passed, or when there was
    # nothing to upgrade from.
    if: >-
      ${{ !cancelled() && needs.build.result == 'success' && needs.iso.result == 'success'
      && (needs.upgrade.result == 'success' || needs.upgrade.result == 'skipped') }}
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
      id-token: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      CHANNEL: ${{ needs.version.outputs.channel }}
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: iso-*-*
          path: dist
          merge-multiple: true
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Checksums
        run: |
          go run ./packaging/release checksums -dir dist
          cat dist/SHA256SUMS
      - name: Sign
        run: |
          for file in dist/*; do
            case $file in *.sigstore.json) continue ;; esac
            cosign sign-blob --yes --bundle "$file.sigstore.json" "$file"
          done
      - name: Manifest
        run: |
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG"
          go run ./packaging/release manifest -dir dist -tag "$TAG" -base-url "$base" \
            -notes "https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"
          cosign sign-blob --yes --bundle dist/release.json.sigstore.json dist/release.json
      - name: Check a signature as servers will
        run: |
          case $CHANNEL in
          nightly) ref=refs/heads/main ;;
          *) ref=refs/tags/$TAG ;;
          esac
          for file in racksail-linux-amd64 SHA256SUMS release.json; do
            cosign verify-blob --bundle "dist/$file.sigstore.json" \
              --certificate-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@$ref" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com "dist/$file"
          done
          # Through a mirror, install.sh checks against the Sigstore trusted
          # root it pins rather than the current one, so that has to work too.
          root=$(sed -n 's/^SIGSTORE_ROOT_SHA256=//p' dist/install.sh)
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/trusted_root.json" \
            "https://tuf-repo-cdn.sigstore.dev/targets/$root.trusted_root.json"
          echo "$root  $RUNNER_TEMP/trusted_root.json" | sha256sum --check
          for file in racksail-linux-amd64 racksail-linux-arm64 SHA256SUMS; do
            cosign verify-blob --bundle "dist/$file.sigstore.json" --trusted-root "$RUNNER_TEMP/trusted_root.json" \
              --certificate-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@$ref" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com "dist/$file"
          done
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=(--title "Racksail $VERSION" --generate-notes --target "$GITHUB_SHA")
          if [ "$CHANNEL" = stable ]; then
            flags+=(--latest)
          else
            flags+=(--prerelease --latest=false)
          fi
          if [ "$CHANNEL" != nightly ]; then
            flags+=(--verify-tag)
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" "${flags[@]}" dist/*
          fi
      - name: Keep the last two weeks of nightly builds
        if: env.CHANNEL == 'nightly'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The list comes newest first.
          gh release list --limit 200 --json tagName --jq '.[].tagName' | grep nightly | tail -n +15 |
            while read -r tag; do
              gh release delete "$tag" --cleanup-tag --yes
            done
