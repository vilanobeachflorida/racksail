name: End to end

# Every night: builds the binaries and the installer images from main,
# installs Racksail on QEMU machines the way people do, and runs the API and
# browser suites against each. The matrix covers the firmware, disk layouts,
# disk buses and network setups the installer supports, both architectures,
# the firmware image, and converting one of Debian's cloud images.
on:
  schedule:
    - cron: "10 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e
  cancel-in-progress: false

jobs:
  binaries:
    name: Binaries
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: make cross
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-binaries
          path: bin/racksail-linux-*
          retention-days: 3

  iso:
    name: ISO
    needs: binaries
    uses: ./.github/workflows/iso.yml
    with:
      version: 0.0.0-dev
      binaries: e2e-binaries

  install:
    name: ${{ matrix.name }}
    needs: iso
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: amd64, UEFI with Secure Boot
            arch: amd64
            runner: ubuntu-24.04
            image: racksail-0.0.0-dev-amd64.iso
            flags: -firmware secureboot
          - name: amd64, BIOS
            arch: amd64
            runner: ubuntu-24.04
            image: racksail-0.0.0-dev-amd64.iso
            flags: -firmware bios
          - name: amd64, mirror on two SATA disks
            arch: amd64
            runner: ubuntu-24.04
            image: racksail-0.0.0-dev-amd64.iso
            flags: -firmware uefi -disks 2 -disk-bus sata -answers test/fixtures/answers/install-mirror.yaml
          - name: amd64, NVMe with a static address
            arch: amd64
            runner: ubuntu-24.04
            image: racksail-0.0.0-dev-amd64.iso
            flags: -firmware uefi -disk-bus nvme -answers test/fixtures/answers/install-static.yaml
          - name: amd64, firmware image
            arch: amd64
            runner: ubuntu-24.04
            image: racksail-0.0.0-dev-amd64-firmware.iso
            flags: -firmware secureboot
          - name: arm64, UEFI
            arch: arm64
            runner: ubuntu-24.04-arm
            image: racksail-0.0.0-dev-arm64.iso
            flags: -firmware uefi -install-timeout 3h -boot-timeout 1h
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: test/e2e/package-lock.json
      - name: Install QEMU and the firmware
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends qemu-utils qemu-system-x86 qemu-system-arm ovmf qemu-efi-aarch64 dosfstools mtools
      - name: Let the runner use KVM
        run: |
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
          else
            echo "No KVM here; the machine runs emulated."
          fi
      - run: cd test/e2e && npm ci --no-audit --no-fund && npx playwright install --with-deps chromium
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: iso-${{ matrix.arch }}-*
          path: dist
          merge-multiple: true
      - name: Install and test
        env:
          IMAGE: dist/${{ matrix.image }}
          FLAGS: ${{ matrix.flags }}
        run: make e2e ISO="$IMAGE" E2E_FLAGS="$FLAGS -work build/e2e"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-logs-${{ strategy.job-index }}
          path: build/e2e/logs
          retention-days: 14

  cloud:
    name: Debian cloud image, converted
    needs: binaries
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: test/e2e/package-lock.json
      - name: Install QEMU and the firmware
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends qemu-utils qemu-system-x86 ovmf dosfstools mtools
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: cd test/e2e && npm ci --no-audit --no-fund && npx playwright install --with-deps chromium
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: e2e-binaries
          path: bin
      - name: Download Debian's cloud image
        run: |
          base=https://cloud.debian.org/images/cloud/trixie/latest
          image=debian-13-genericcloud-amd64.qcow2
          mkdir -p build/cloud
          curl --fail --silent --show-error --location --output build/cloud/SHA512SUMS "$base/SHA512SUMS"
          curl --fail --silent --show-error --location --output "build/cloud/$image" "$base/$image"
          cd build/cloud && grep " $image\$" SHA512SUMS | sha512sum --check
      - name: Convert and test
        run: |
          chmod +x bin/racksail-linux-amd64
          go run ./test/qemu -cloud-image build/cloud/debian-13-genericcloud-amd64.qcow2 \
            -binary bin/racksail-linux-amd64 -version 0.0.0-dev -work build/e2e
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-logs-cloud
          path: build/e2e/logs
          retention-days: 14
