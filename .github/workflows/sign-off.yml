name: Sign-off

# Every commit in a pull request certifies the Developer Certificate of
# Origin with a Signed-off-by line for its author (decision P3 in
# docs/architecture/decisions.md). Merge commits, and commits GitHub Apps
# make, such as Renovate's updates and the pins workflow's checksums, have
# no person to certify anything and are left out.
on:
  pull_request:

permissions:
  contents: read

jobs:
  sign-off:
    name: Developer Certificate of Origin
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check every commit's sign-off
        env:
          BASE: origin/${{ github.event.pull_request.base.ref }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          from=$(git merge-base "$BASE" "$HEAD")
          missing=()
          # The pull request's own commits, not those of the base branch
          # that merging it in brought along.
          while read -r commit; do
            email=$(git show --no-patch --format=%ae "$commit")
            case $email in
            *"[bot]@users.noreply.github.com") continue ;;
            esac
            if ! git show --no-patch --format='%(trailers:key=Signed-off-by,valueonly)' "$commit" | grep --quiet --ignore-case --fixed-strings "<$email>"; then
              missing+=("$(git show --no-patch --format='%h %s (%an <%ae>)' "$commit")")
            fi
          done < <(git rev-list --no-merges "$HEAD" --not "$BASE")
          if [ ${#missing[@]} -eq 0 ]; then
            echo "Every commit is signed off by its author."
            exit 0
          fi
          {
            echo "These commits have no Signed-off-by line for their author:"
            echo
            printf -- '- %s\n' "${missing[@]}"
            echo
            echo "Signing off certifies the Developer Certificate of Origin, https://developercertificate.org/."
            echo "To sign off the commits already made, then push them again:"
            echo
            echo "    git rebase --signoff $from"
            echo "    git push --force-with-lease"
          } | tee --append "$GITHUB_STEP_SUMMARY"
          exit 1
