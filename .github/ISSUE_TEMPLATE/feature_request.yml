name: Feature request
description: Suggest something Racksail should do.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        The full feature list for 1.0 is in [features.md](https://github.com/vilanobeachflorida/racksail/blob/main/docs/architecture/features.md). If what you want is on it, a request still helps when you can tell us how you'd use it.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you're trying to do and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you'd like
      description: How you'd like it to work, from your point of view.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Workarounds you use now, or how other tools solve it.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Core platform, API or command line
        - Network
        - Web hosting
        - Hosting business
        - Databases
        - DNS
        - Mail
        - Containers
        - Virtual machines
        - Storage and shares
        - Home extras
        - Marketplace and recipes
        - Backups
        - Monitoring and analytics
        - Files and terminal
        - Performance
        - Builder
        - Assistant
        - Automations
        - Migration
        - Multi-server
        - Security
        - Installer and updates
        - UI and themes
        - Documentation
        - Something else
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Before you send it
      options:
        - label: I searched the existing issues and this isn't one of them.
          required: true
