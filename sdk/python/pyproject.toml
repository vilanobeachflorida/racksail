[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "racksail-addon"
version = "0.0.0"
description = "Write Racksail add-ons in Python."
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = []
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: POSIX :: Linux",
]

[project.urls]
Homepage = "https://github.com/vilanobeachflorida/racksail"
Documentation = "https://vilanobeachflorida.github.io/racksail/addons/sdks/"

[tool.setuptools.packages.find]
where = ["src"]
