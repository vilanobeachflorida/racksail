# live-build leaves the image without /etc/hosts and with an empty
# resolv.conf, which live-config would fill in at boot. The installer image
# has no live-config, so these do it.
f /etc/hosts 0644 root root - 127.0.0.1\tlocalhost\n127.0.1.1\tracksail-installer\n::1\tlocalhost ip6-localhost ip6-loopback\n
L+ /etc/resolv.conf - - - - ../run/systemd/resolve/stub-resolv.conf
