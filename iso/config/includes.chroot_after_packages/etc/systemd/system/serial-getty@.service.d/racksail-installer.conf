# The installer also runs on every serial console the kernel was started
# with, such as an IPMI or cloud serial console.
[Service]
ExecStart=
ExecStart=-/usr/local/bin/racksail install
StandardInput=tty
StandardOutput=tty
StandardError=journal
Environment=TERM=vt220 LANG=C.UTF-8 RACKSAIL_CONSOLE=%I
RestartSec=1
