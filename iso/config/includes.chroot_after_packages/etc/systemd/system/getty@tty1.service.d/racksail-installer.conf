# The installer runs on the first console in place of a login prompt, and
# starts again if it exits. It finds an answers file by itself. What it says
# when it stops, an error included, stays on the console for whoever is
# installing.
[Service]
ExecStart=
ExecStart=-/usr/local/bin/racksail install
StandardInput=tty
StandardOutput=tty
StandardError=tty
TTYVTDisallocate=no
Environment=TERM=linux LANG=C.UTF-8 RACKSAIL_CONSOLE=%I
RestartSec=1
