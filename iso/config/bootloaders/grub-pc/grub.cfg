source /boot/grub/config.cfg

# Every entry starts racksail install on the first console and on the
# serial console. The last console= is where boot messages and the splash
# go, so the serial entry lists the serial port last.
menuentry "Install Racksail" --hotkey=i --id=install {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@ quiet splash console=${racksail_serial},115200n8 console=tty0
	initrd	@INITRD_LIVE@
}

menuentry "Install Racksail on the serial console" --hotkey=s --id=serial {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@ console=tty0 console=${racksail_serial},115200n8
	initrd	@INITRD_LIVE@
}

menuentry "Install Racksail with basic graphics" --hotkey=b --id=basic {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@ nomodeset console=${racksail_serial},115200n8 console=tty0
	initrd	@INITRD_LIVE@
}

submenu "Utilities" --hotkey=u {
	source /boot/grub/theme.cfg

	menuentry "Check the installer for errors" --hotkey=c {
		linux	@KERNEL_LIVE@ @APPEND_VERIFY_CHECKSUMS@ console=${racksail_serial},115200n8 console=tty0
		initrd	@INITRD_LIVE@
	}

	if [ "${grub_platform}" = "efi" ]; then
		menuentry "Firmware settings" --hotkey=f {
			fwsetup
		}
		menuentry "Boot from the next device" --hotkey=n {
			exit
		}
	else
		menuentry "Boot from the first disk" --hotkey=d {
			set root=(hd0)
			chainloader +1
		}
	fi

	menuentry "Restart" --hotkey=r {
		reboot
	}
	menuentry "Shut down" --hotkey=p {
		halt
	}
}
