# The boot menu's setup, for BIOS and UEFI alike. live-build copies this
# directory over its own templates; the entries are in grub.cfg.

set default=install
set timeout=10
set timeout_style=menu

if [ "${grub_cpu}" = "arm64" ]; then
	set racksail_serial=ttyAMA0
else
	set racksail_serial=ttyS0
fi
export racksail_serial

# Arm servers show the firmware's console on their serial port, so the menu
# stays on that console there. Elsewhere it is drawn in the boot theme and
# mirrored to the first serial port.
if [ "${grub_platform}" = "efi" ] && [ "${grub_cpu}" = "arm64" ]; then
	terminal_output console
else
	if loadfont /boot/grub/racksail/inter-regular-16.pf2; then
		loadfont /boot/grub/racksail/inter-regular-14.pf2
		loadfont /boot/grub/racksail/inter-regular-18.pf2
		loadfont /boot/grub/racksail/inter-bold-18.pf2
		loadfont /boot/grub/racksail/inter-bold-24.pf2
		set gfxmode=auto
		set gfxpayload=keep
		insmod all_video
		insmod gfxterm
		insmod png
		terminal_output gfxterm
	fi
	if serial --unit=0 --speed=115200; then
		terminal_input --append serial
		terminal_output --append serial
	fi
fi

source /boot/grub/theme.cfg
