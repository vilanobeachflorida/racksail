# The boot theme, applied again in every submenu. Without graphics the menu
# keeps the brand's colors as near as a text console has them.
set menu_color_normal=white/blue
set menu_color_highlight=blue/white
if [ -e /boot/grub/racksail/theme.txt ]; then
	set theme=/boot/grub/racksail/theme.txt
	export theme
fi
