#cloud-config
# For networks that reach Racksail's releases only through a mirror, such
# as an internal web server that copies them from GitHub. Installing then
# needs nothing from GitHub or Sigstore. The mirror serves
#
#   v1.0.0/              each release's files under its tag, as
#                        v1.0.0/racksail-linux-amd64
#   cosign/<version>/    the cosign release install.sh names in
#                        COSIGN_VERSION, as cosign/<version>/cosign-linux-amd64
#   sigstore/            Sigstore's trusted root that install.sh names in
#                        SIGSTORE_ROOT_SHA256, as sigstore/<checksum>.trusted_root.json
#
# Copy the last two from https://github.com/sigstore/cosign/releases and
# https://tuf-repo-cdn.sigstore.dev/targets/<checksum>.trusted_root.json.
# Use a mirror you trust to serve the install script unchanged; the script
# checks everything else against the checksums and Racksail's signatures,
# so a changed cosign, trusted root, binary or checksum file is refused.
hostname: panel
fqdn: panel.example.com
prefer_fqdn_over_hostname: true

package_update: true
packages:
  - ca-certificates
  - curl

runcmd:
  - [curl, --fail, --silent, --show-error, --location, --proto, "=https", --output, /root/racksail-install.sh, "https://mirror.example.com/racksail/v1.0.0/install.sh"]
  - [sh, /root/racksail-install.sh, --yes, --mirror, "https://mirror.example.com/racksail", --version, "1.0.0", --hostname, panel.example.com]
  - [rm, -f, /root/racksail-install.sh]
