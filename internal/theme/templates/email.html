<!doctype html>
<html lang="{{lang}}" dir="{{dir}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>{{title}}</title>
<style>{{style}}
body { margin: 0; padding: 0; background: var(--rs-surface); color: var(--rs-text); font-family: var(--rs-font-sans); line-height: 1.5; }
.preheader { display: none; max-height: 0; overflow: hidden; }
.wrap { max-width: 36rem; margin: 0 auto; padding: 1.5rem 1rem; }
.card { background: var(--rs-surface-raised); border: 1px solid var(--rs-border); border-radius: 10px; padding: 1.5rem; }
.logo { display: block; max-height: 2rem; max-width: 10rem; margin-block-end: 1.25rem; }
.brand { margin: 0 0 1.25rem; font-weight: 700; color: var(--rs-brand); }
h1 { font-size: 1.375rem; line-height: 1.3; margin: 0 0 1rem; }
.body { margin: 0 0 1.5rem; white-space: pre-line; }
.action { display: inline-block; padding: 0.625rem 1.25rem; border-radius: 6px; background: var(--rs-accent); color: var(--rs-accent-text); font-weight: 600; text-decoration: none; }
.footer { margin: 1.25rem 0 0; color: var(--rs-text-muted); font-size: 0.8125rem; }
</style>
</head>
<body>
<div class="preheader">{{preheader}}</div>
<div class="wrap">
<div class="card">
{{logo}}
<p class="brand">{{brandName}}</p>
<h1>{{title}}</h1>
<p class="body">{{body}}</p>
<a class="action" href="{{actionUrl}}">{{actionLabel}}</a>
</div>
<p class="footer">{{footer}}</p>
</div>
</body>
</html>
