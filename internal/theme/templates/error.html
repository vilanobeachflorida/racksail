<!doctype html>
<html lang="{{lang}}" dir="{{dir}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>{{title}}</title>
<style>{{style}}
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--rs-surface); color: var(--rs-text); font-family: var(--rs-font-sans); line-height: 1.5; }
main { max-width: 34rem; padding: 2rem 1rem; }
.logo { display: block; max-height: 2.5rem; max-width: 12rem; margin-block-end: 2rem; }
.status { margin: 0; color: var(--rs-text-muted); font-family: var(--rs-font-mono); font-size: 0.875rem; }
h1 { font-size: 1.75rem; line-height: 1.25; margin: 0.25rem 0 0.75rem; }
p { margin: 0 0 1rem; }
.meta { color: var(--rs-text-muted); font-size: 0.875rem; }
code { font-family: var(--rs-font-mono); }
</style>
</head>
<body>
<main>
{{logo}}
<p class="status">{{status}}</p>
<h1>{{title}}</h1>
<p>{{message}}</p>
<p class="meta">{{siteName}} · <code>{{requestId}}</code></p>
<p class="meta">{{brandName}}</p>
</main>
</body>
</html>
