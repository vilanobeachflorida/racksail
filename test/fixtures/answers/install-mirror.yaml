# An unattended install on two disks in a Btrfs mirror.
format: 1
mode: install
hostname: racksail-mirror.example.test
network: {mode: dhcp, ipv6: {mode: auto}}
disks:
  layout: mirror
  devices: [/dev/vda, /dev/vdb]
  confirmWipe: true
