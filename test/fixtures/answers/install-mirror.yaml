  username: admin
  sshKeys: ["ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILOVCx0Utmhvafzmm0HYOckUK9zP6j0GTY3znySw9HGV e2e@racksail.test"]
reboot: true
